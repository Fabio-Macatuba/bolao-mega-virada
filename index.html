<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador do Google Sheets</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-white shadow-sm py-4 px-6">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-slate-800">📊 Painel Google Sheets</h1>
            <div class="flex items-center gap-3">
                <a href="https://script.google.com/macros/s/AKfycbz6D_95II-VZjhha4JpO8N2fobVUJAPxSFqRfoQ-7UA765zW8-USok6AUZ2D5stHrgX/exec" 
                   target="_blank" 
                   class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-2">
                    🔗 Abrir em Tela Cheia
                </a>
                <button onclick="recarregarFrame()" 
                        class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg transition">
                    🔄 Recarregar
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal (Iframe) -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col">
        <div class="bg-white rounded-2xl shadow-md overflow-hidden flex-grow flex flex-col h-[75vh] border border-slate-200">
            <iframe id="sheetsFrame" 
                    src="https://script.google.com/macros/s/AKfycbz6D_95II-VZjhha4JpO8N2fobVUJAPxSFqRfoQ-7UA765zW8-USok6AUZ2D5stHrgX/exec" 
                    class="w-full h-full border-0"
                    title="Google Sheets Web App">
            </iframe>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4 text-xs text-slate-500">
        Hospedado no GitHub Pages &bull; Integrado ao Google Apps Script
    </footer>

    <!-- Script para atualizar o iframe se necessário -->
    <script>
        function recarregarFrame() {
            const iframe = document.getElementById('sheetsFrame');
            iframe.src = iframe.src;
        }
    </script>
</body>
</html>
